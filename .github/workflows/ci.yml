name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run obsolete; don't queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage-engine:
    # Runs on Linux and finishes in under a minute, so a broken issue form or a
    # broken triage rule fails fast instead of waiting on the macOS build.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml pytest

      - name: Validate issue forms and labels
        run: python scripts/triage/triage.py --check-templates

      - name: Test triage engine
        run: pytest scripts/triage/test_triage.py -q

  backend-linux:
    # Proves the Go backend is genuinely portable rather than portable in
    # principle. backend/fake means the whole suite runs with no hardware, so a
    # macOS-only assumption creeping back into nxmtp fails here in under a
    # minute instead of surfacing during a port.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21.x'
          cache-dependency-path: backend/go.mod

      - name: Install libusb
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libusb-1.0-0-dev pkg-config

      - name: Check gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Go files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Go build
        working-directory: backend
        run: go build ./...

      - name: Go test
        working-directory: backend
        run: go test ./...

  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21.x'
          cache-dependency-path: backend/go.mod

      - name: Cache libusb
        uses: actions/cache@v6
        with:
          path: third_party/libusb
          key: ${{ runner.os }}-libusb-${{ hashFiles('scripts/build-libusb.sh') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build libusb
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          ./scripts/build-libusb.sh

      - name: Check gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Go files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Go vet
        working-directory: backend
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          go vet ./...

      - name: Go test
        working-directory: backend
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          go test ./...

      - name: Build backend and app
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          ./scripts/build-app.sh
